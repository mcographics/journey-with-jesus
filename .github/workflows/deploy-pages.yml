name: Deploy Journey with Jesus to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Install browser for end-to-end checks
        run: npx playwright install --with-deps chromium
      - name: End-to-end checks
        run: npm run test:e2e
      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /journey-with-jesus
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload static export
        uses: actions/upload-pages-artifact@v5
        with:
          path: out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5.0.1
